<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>M.NAJM | Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
    </style>
</head>
<body class="p-10">
    <h1 class="text-3xl font-black text-green-500 mb-10">لوحة إدارة المدفوعات</h1>
    <div id="list" class="grid md:grid-cols-3 gap-6"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://mahmodya-73e03-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('payments').on('value', snap => {
            const data = snap.val(), container = document.getElementById('list');
            container.innerHTML = "";
            if(!data) return;
            Object.keys(data).forEach(id => {
                if(data[id].status === 'pending') {
                    container.innerHTML += `
                    <div class="card p-5">
                        <div class="text-xs text-gray-500 mb-2">${data[id].email}</div>
                        <img src="${data[id].image}" class="w-full h-40 object-cover rounded-lg mb-4" onclick="window.open(this.src)">
                        <div class="flex gap-2">
                            <button onclick="approve('${id}', '${data[id].userId}')" class="flex-1 bg-green-600 py-2 rounded-lg font-bold">قبول</button>
                            <button onclick="reject('${id}')" class="flex-1 bg-red-900 py-2 rounded-lg">رفض</button>
                        </div>
                    </div>`;
                }
            });
        });

        async function approve(pid, uid) {
            const uRef = db.ref('users/' + uid + '/coins');
            const s = await uRef.get();
            await uRef.set((s.val() || 0) + 1000);
            await db.ref('payments/' + pid).update({ status: 'approved' });
            alert('تم الشحن!');
        }

        async function reject(pid) {
            await db.ref('payments/' + pid).update({ status: 'rejected' });
        }
    </script>
</body>
</html>
