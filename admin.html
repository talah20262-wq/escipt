<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>M.NAJM | Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Segoe UI'; padding: 20px; }
        .user-row { background: #111; padding: 15px; border: 1px solid #7000ff; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        input[type="number"] { width: 80px; padding: 5px; border-radius: 5px; }
        button { background: #00f3ff; color: black; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1 style="color: #7000ff;">لوحة تحكم الإدارة - M.NAJM</h1>
    <div id="usersList">جاري تحميل المستخدمين...</div>

    <script>
        // نفس الـ config الخاص بـ Firebase هنا
        const config = { /* ضع بياناتك هنا */ };
        firebase.initializeApp(config);
        const db = firebase.database();

        // جلب جميع المستخدمين وعرضهم
        db.ref('users').on('value', (snapshot) => {
            const list = document.getElementById('usersList');
            list.innerHTML = "";
            snapshot.forEach((child) => {
                const user = child.val();
                const userId = child.key;
                list.innerHTML += `
                    <div class="user-row">
                        <div>
                            <strong>${user.email}</strong> <br>
                            الرصيد الحالي: <span style="color:#00f3ff">${user.coins || 0}</span>
                        </div>
                        <div>
                            <input type="number" id="input-${userId}" placeholder="قيمة">
                            <button onclick="updateCoins('${userId}')">إضافة عملات</button>
                        </div>
                    </div>
                `;
            });
        });

        // وظيفة تعديل العملات
        function updateCoins(uid) {
            const amount = document.getElementById('input-' + uid).value;
            if(!amount) return alert("دخل القيمة");
            
            db.ref('users/' + uid + '/coins').transaction((current) => {
                return (current || 0) + parseInt(amount);
            }).then(() => alert("تم التحديث بنجاح!"));
        }
    </script>
</body>
</html>
