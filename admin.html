<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الأدمن - Talla</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: Arial; padding: 20px; }
        .admin-card { border: 1px solid #7000ff; padding: 20px; border-radius: 10px; background: #111; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: center; }
        th { background: #7000ff; }
        input { padding: 5px; width: 60px; }
        button { cursor: pointer; background: #7000ff; color: #fff; border: none; padding: 5px 10px; border-radius: 3px; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2 style="color: #7000ff;">لوحة التحكم الشاملة (Admin)</h2>
    <table>
        <thead>
            <tr>
                <th>ID المستخدم</th>
                <th>البريد الإلكتروني</th>
                <th>الرصيد</th>
                <th>تعديل الرصيد</th>
            </tr>
        </thead>
        <tbody id="users-list">
            <!-- البيانات تظهر هنا -->
        </tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB1N7DfU_VUbNeDzCz2Ke2vc7rPWuPGY_0",
        databaseURL: "https://mahmodya-73e03-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب قائمة المستخدمين
    db.ref('users').on('value', (snapshot) => {
        const usersList = document.getElementById('users-list');
        usersList.innerHTML = '';
        snapshot.forEach((childSnapshot) => {
            const userId = childSnapshot.key;
            const data = childSnapshot.val();
            usersList.innerHTML += `
                <tr>
                    <td>${userId.substring(0,5)}...</td>
                    <td>${data.email}</td>
                    <td id="bal-${userId}">${data.balance}</td>
                    <td>
                        <input type="number" id="input-${userId}" placeholder="القيمة">
                        <button onclick="updateBalance('${userId}')">تحديث</button>
                    </td>
                </tr>
            `;
        });
    });

    // دالة تحديث الرصيد من الأدمن
    function updateBalance(uid) {
        const newVal = document.getElementById('input-'+uid).value;
        if(newVal !== "") {
            db.ref('users/' + uid).update({ balance: parseInt(newVal) })
              .then(() => alert("تم تحديث الرصيد بنجاح"));
        }
    }
</script>
</body>
</html>
