<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>M.NAJM Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #eee; font-family: sans-serif; padding: 20px; }
        .request-card { background: #111; border: 1px solid #7000ff; padding: 15px; margin: 10px; border-radius: 10px; display: inline-block; width: 300px; vertical-align: top; }
        img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; cursor: pointer; }
        .btn-approve { background: #00ff00; border: none; padding: 10px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>لوحة تحكم M.NAJM 👑</h1>
    
    <h3>طلبات الشحن المعلقة ⏳</h3>
    <div id="requests-container"></div>

    <hr style="border: 0.5px solid #333; margin: 40px 0;">

    <h3>إدارة المستخدمين 👥</h3>
    <div id="users-list"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB1N7DfU_VUbNeDzCz2Ke2vc7rPWuPGY_0",
        databaseURL: "https://mahmodya-73e03-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // جلب طلبات الشحن
    db.ref('paymentRequests').on('value', snap => {
        const container = document.getElementById('requests-container');
        container.innerHTML = '';
        snap.forEach(child => {
            const req = child.val();
            if(req.status === 'pending') {
                container.innerHTML += `
                    <div class="request-card">
                        <p>من: ${req.email}</p>
                        <img src="${req.img}" onclick="window.open('${req.img}')">
                        <input type="number" id="amt-${child.key}" placeholder="كمية العملات">
                        <button class="btn-approve" onclick="approve('${child.key}', '${req.uid}')">موافقة وشحن</button>
                    </div>
                `;
            }
        });
    });

    function approve(reqId, uid) {
        const amount = document.getElementById('amt-' + reqId).value;
        if(!amount) return alert("حدد الكمية");
        
        // تحديث رصيد المستخدم
        db.ref('users/' + uid + '/balance').transaction(current => (current || 0) + parseInt(amount));
        // تحديث حالة الطلب
        db.ref('paymentRequests/' + reqId).update({ status: 'approved' });
        alert("تم الشحن بنجاح!");
    }

    // عرض المستخدمين
    db.ref('users').on('value', snap => {
        const list = document.getElementById('users-list');
        list.innerHTML = '<table><tr><th>الإيميل</th><th>الرصيد</th></tr>';
        snap.forEach(child => {
            const u = child.val();
            list.innerHTML += `<tr><td>${u.email}</td><td>${u.balance}</td></tr>`;
        });
        list.innerHTML += '</table>';
    });
</script>
</body>
</html>
