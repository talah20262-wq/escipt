<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>M.NAJM | Admin Control</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: white; }
        .admin-card { background: #111; border: 1px solid #39ff14; }
    </style>
</head>
<body class="p-8">
    <h1 class="text-3xl font-black text-[#39ff14] mb-8">إدارة نظام M.NAJM</h1>

    <div id="paymentsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Transactions will appear here -->
    </div>

    <script>
        // Use your config here
        firebase.initializeApp({ /* SAME CONFIG AS ABOVE */ });
        const db = firebase.database();

        // 1. Listen for Pending Payments
        db.ref('payments').orderByChild('status').equalTo('pending').on('value', snap => {
            const list = document.getElementById('paymentsList');
            list.innerHTML = "";
            snap.forEach(child => {
                const p = child.val();
                list.innerHTML += `
                    <div class="admin-card p-5 rounded-xl">
                        <p class="text-sm text-gray-400">المستخدم: ${p.userEmail}</p>
                        <img src="${p.imageURL}" class="w-full h-40 object-cover my-3 rounded-lg cursor-pointer" onclick="window.open('${p.imageURL}')">
                        <div class="flex gap-2">
                            <button onclick="approvePayment('${child.key}', '${p.userId}')" class="bg-green-600 flex-1 py-2 rounded-lg">قبول (1000 عملة)</button>
                            <button onclick="rejectPayment('${child.key}')" class="bg-red-600 flex-1 py-2 rounded-lg">رفض</button>
                        </div>
                    </div>
                `;
            });
        });

        // 2. Approval Logic
        async function approvePayment(payId, userId) {
            // Add 1000 coins to user
            await db.ref('users/' + userId + '/coins').transaction(c => (c || 0) + 1000);
            // Update payment status
            await db.ref('payments/' + payId).update({ status: 'approved' });
            alert("تم شحن الرصيد للمستخدم!");
        }

        async function rejectPayment(payId) {
            await db.ref('payments/' + payId).update({ status: 'rejected' });
        }
    </script>
</body>
</html>
