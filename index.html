<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talla - بوابة المستخدم</title>
    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; text-align: center; }
        .container { margin-top: 50px; padding: 20px; border: 1px solid #00f2ff; border-radius: 15px; display: inline-block; }
        .btn-neon { background: none; border: 2px solid #00f2ff; color: #00f2ff; padding: 10px 25px; cursor: pointer; transition: 0.3s; }
        .btn-neon:hover { background: #00f2ff; color: #000; box-shadow: 0 0 20px #00f2ff; }
        input { background: #111; border: 1px solid #444; color: #fff; padding: 8px; margin: 5px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #00f2ff;">نظام محاكاة Talla</h2>
    <div id="auth-section">
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <br><br>
        <button class="btn-neon" onclick="login()">دخول</button>
        <button class="btn-neon" onclick="register()">تسجيل جديد</button>
    </div>
    
    <div id="user-section" style="display:none;">
        <h3>مرحباً بك: <span id="user-email"></span></h3>
        <p>رصيدك الحالي: <span id="user-balance" style="color: #00f2ff;">0</span> عملة</p>
        <button class="btn-neon" onclick="logout()">خروج</button>
    </div>
</div>

<script>
    // الإعدادات اللي جبناها سوا
    const firebaseConfig = {
        apiKey: "AIzaSyB1N7DfU_VUbNeDzCz2Ke2vc7rPWuPGY_0",
        authDomain: "mahmodya-73e03.firebaseapp.com",
        databaseURL: "https://mahmodya-73e03-default-rtdb.firebaseio.com",
        projectId: "mahmodya-73e03",
        storageBucket: "mahmodya-73e03.firebasestorage.app",
        appId: "1:659673740771:web:0a99b82c985072a754dcd6"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // دالة الدخول
    function login() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(e, p)
            .then(res => { alert("تم الدخول بنجاح"); showUser(res.user); })
            .catch(err => alert(err.message));
    }

    // دالة التسجيل
    function register() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        auth.createUserWithEmailAndPassword(e, p).then(res => {
            db.ref('users/' + res.user.uid).set({ email: e, balance: 100 }); // رصيد افتتاحي
            alert("تم إنشاء الحساب");
        }).catch(err => alert(err.message));
    }

    function showUser(user) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('user-section').style.display = 'block';
        document.getElementById('user-email').innerText = user.email;
        db.ref('users/' + user.uid + '/balance').on('value', snap => {
            document.getElementById('user-balance').innerText = snap.val() || 0;
        });
    }

    function logout() { auth.signOut().then(() => location.reload()); }
</script>
</body>
</html>
