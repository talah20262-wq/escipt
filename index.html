<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.NAJM | Radar System Armed</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <style>
        :root { --neon-green: #39ff14; --cyber-red: #ff003c; --deep-space: #050505; --fuel-gold: #ffcc00; }
        body { background: var(--deep-space); color: #fff; font-family: 'Courier New', Courier, monospace; margin: 0; overflow-x: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        /* 🌌 خلفية النجوم المتحركة */
        body::after { content:""; position:fixed; width:100%; height:100%; background:radial-gradient(var(--neon-green) 1px, transparent 1px); background-size:40px 40px; opacity:0.05; z-index: -1; }

        .radar-container { background: rgba(0, 20, 0, 0.9); border: 2px solid var(--neon-green); border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; box-shadow: 0 0 50px rgba(57, 255, 20, 0.2); position: relative; text-align: center; }

        /* 🔥 Header */
        .header-text { font-size: 0.8rem; color: var(--neon-green); text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid rgba(57, 255, 20, 0.3); padding-bottom: 10px; }

        /* 💰 Fuel Balance Style */
        .fuel-badge { position: absolute; top: -20px; right: 20px; background: #000; border: 2px solid var(--fuel-gold); color: var(--fuel-gold); padding: 5px 15px; border-radius: 50px; font-weight: bold; box-shadow: 0 0 15px var(--fuel-gold); }

        /* ✈️ Plane Animation Area */
        #radar-screen { height: 250px; background: repeating-radial-gradient(circle, #001a00 0%, #001a00 10%, #002200 11%); border: 1px solid var(--neon-green); border-radius: 15px; margin: 20px 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #plane { position: absolute; bottom: 20px; right: 20px; font-size: 40px; transition: all 2s cubic-bezier(0.1, 0.7, 1.0, 0.1); filter: drop-shadow(0 0 10px var(--neon-green)); }
        #multiplier-text { font-size: 3.5rem; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 20px var(--neon-green); z-index: 10; }

        /* 🎬 UI Classes */
        .flash { animation: flash 0.3s 3; }
        @keyframes flash { 0% { opacity:1; } 50% { opacity:0.2; } 100% { opacity:1; } }

        .btn-launch { background: none; border: 2px solid var(--neon-green); color: var(--neon-green); padding: 15px; width: 100%; border-radius: 10px; font-size: 1.2rem; cursor: pointer; transition: 0.3s; font-weight: bold; text-transform: uppercase; }
        .btn-launch:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 30px var(--neon-green); }

        input { background: #000; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 10px; width: 80%; border-radius: 5px; margin: 10px 0; outline: none; }
        
        /* Admin Overlay */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; padding: 20px; overflow-y: auto; box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- الدخول -->
    <div id="auth-box" class="radar-container">
        <div class="header-text">System Armed. Radar Activated.</div>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn-launch" onclick="handleAuth()">Access System</button>
    </div>

    <!-- اللعبة الرئيسية -->
    <div id="app-box" class="radar-container" style="display: none;">
        <div class="fuel-badge">Fuel Balance: <span id="user-fuel">0</span> L</div>
        <div class="header-text" id="status-line">Scanning the Sky...</div>
        
        <div id="radar-screen">
            <div id="multiplier-text">1.00x</div>
            <div id="plane">✈️</div>
        </div>

        <button id="start-btn" class="btn-launch" onclick="launchRadar()">ابدأ الجولة الآن ⚡</button>
        
        <div style="margin-top:20px; border-top:1px solid var(--neon-green); padding-top:15px;">
            <p style="font-size:10px; color:var(--fuel-gold);">Upgrade Your Fuel — Keep Flying 💸</p>
            <p style="font-size:12px;">Orange Cash: 01206561893</p>
            <input type="file" id="fuel-proof" style="font-size:10px;">
            <button class="btn-launch" style="padding:5px; font-size:0.8rem; border-color:var(--fuel-gold); color:var(--fuel-gold);" onclick="recharge()">ارسال الإثبات</button>
        </div>

        <button id="admin-portal" class="btn-launch" style="margin-top:10px; display:none;" onclick="toggleAdmin(true)">Admin Center 👑</button>
    </div>

    <!-- لوحة الأدمن -->
    <div id="admin-panel">
        <h2 style="color:var(--cyber-red)">Radar Management Dashboard</h2>
        <button onclick="toggleAdmin(false)" style="color:#fff; background:var(--cyber-red); border:none; padding:10px; border-radius:5px;">إغلاق</button>
        <div id="req-list" style="margin-top:20px;"></div>
    </div>

<script>
    // Config Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyB1N7DfU_VUbNeDzCz2Ke2vc7rPWuPGY_0", //
        authDomain: "mahmodya-73e03.firebaseapp.com",
        databaseURL: "https://mahmodya-73e03-default-rtdb.firebaseio.com",
        projectId: "mahmodya-73e03",
        storageBucket: "mahmodya-73e03.firebasestorage.app",
        appId: "1:659673740771:web:0a99b82c985072a754dcd6"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const storage = firebase.storage();

    const OWNER = "talah2026.2@gmail.com";
    let currentFuel = 0;

    // Monitoring Auth
    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('app-box').style.display = 'block';
            if(user.email === OWNER) document.getElementById('admin-portal').style.display = 'block';
            db.ref('users/' + user.uid).on('value', s => {
                currentFuel = s.val()?.balance || 0;
                document.getElementById('user-fuel').innerText = currentFuel;
            });
        }
    });

    function handleAuth() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        auth.signInWithEmailAndPassword(e, p).catch(() => {
            auth.createUserWithEmailAndPassword(e, p).then(r => db.ref('users/'+r.user.uid).set({email:e, balance:50}));
        });
    }

    // 🔥 Typing Effect
    function typeText(text, el){
        let i = 0; el.innerText = "";
        const interval = setInterval(()=>{
            el.innerText += text[i]; i++;
            if(i >= text.length) clearInterval(interval);
        }, 40);
    }

    // ✈️ Fly Logic
    function launchRadar() {
        if(currentFuel < 10) {
            typeText("انتهى الوقود… لازم تعبي قبل الرحلة الجاية ⛽", document.getElementById('status-line'));
            return;
        }

        const btn = document.getElementById('start-btn');
        const plane = document.getElementById("plane");
        const display = document.getElementById("multiplier-text");
        const status = document.getElementById("status-line");

        btn.disabled = true;
        db.ref('users/'+auth.currentUser.uid).update({balance: currentFuel - 10});

        typeText("AI Engine Processing...", status);
        plane.style.transform = `translate(0, 0) scale(1)`;
        display.classList.remove('flash');

        let mult = 1.00;
        let crash = (1.1 + Math.random()*3.4).toFixed(2);

        const timer = setInterval(() => {
            mult += 0.03;
            display.innerText = mult.toFixed(2) + "x";
            
            // Plane Movement
            plane.style.transform = `translate(-${mult*40}px, -${mult*40}px) scale(${1 + mult/10})`;

            if(mult >= crash) {
                clearInterval(timer);
                display.innerText = `LOCKED: ${mult.toFixed(2)}x`;
                display.classList.add('flash');
                typeText(`Target Achieved ⚡ x${mult.toFixed(2)}`, status);
                setTimeout(() => { btn.disabled = false; }, 2000);
            }
        }, 100);
    }

    function recharge() {
        const f = document.getElementById('fuel-proof').files[0];
        if(!f) return alert("Upload proof!");
        storage.ref(`fuel/${Date.now()}`).put(f).then(s => s.ref.getDownloadURL()).then(url => {
            db.ref('requests').push({uid: auth.currentUser.uid, email: auth.currentUser.email, img: url, status: 'p'});
            alert("Fueling request sent to command center.");
        });
    }

    function toggleAdmin(v) {
        document.getElementById('admin-panel').style.display = v ? 'block' : 'none';
        if(v) {
            db.ref('requests').on('value', snap => {
                const list = document.getElementById('req-list');
                list.innerHTML = '';
                snap.forEach(c => {
                    const r = c.val();
                    if(r.status === 'p') {
                        list.innerHTML += `<div style="background:#111; border:1px solid var(--neon-green); padding:10px; margin-bottom:10px;">
                            <p>${r.email}</p>
                            <img src="${r.img}" style="width:100%; max-height:200px; object-fit:contain;">
                            <input type="number" id="amt-${c.key}" placeholder="Fuel Amount">
                            <button class="btn-launch" onclick="approve('${c.key}','${r.uid}')">Approve Fuel</button>
                        </div>`;
                    }
                });
            });
        }
    }

    function approve(k, u) {
        const amt = document.getElementById('amt-'+k).value;
        db.ref('users/'+u+'/balance').transaction(c => (c||0) + parseInt(amt));
        db.ref('requests/'+k).update({status: 'a'});
        alert("Fuel added!");
    }
</script>
</body>
</html>
