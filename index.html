<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.NAJM Platform | Premium Simulation</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-cyan: #00f2ff; --main-purple: #7000ff; --glass: rgba(255, 255, 255, 0.05); }
        body { background: radial-gradient(circle at center, #111, #000); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; }
        .glass-card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px; width: 90%; max-width: 450px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative; }
        h1, h2 { text-align: center; color: var(--main-cyan); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 20px; }
        input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #333; padding: 12px 15px; border-radius: 12px; color: #fff; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-color: var(--main-cyan); box-shadow: 0 0 15px rgba(0,242,255,0.2); }
        .btn-neon { width: 100%; padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.5s; margin-top: 10px; position: relative; overflow: hidden; }
        .btn-cyan { background: var(--main-cyan); color: #000; box-shadow: 0 0 20px rgba(0,242,255,0.4); }
        .btn-purple { background: var(--main-purple); color: #fff; box-shadow: 0 0 20px rgba(112,0,255,0.4); }
        
        /* Engine UI */
        #display-box { height: 180px; background: rgba(0,0,0,0.5); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 4rem; font-weight: 800; border: 1px solid #222; margin-bottom: 20px; color: var(--main-cyan); text-shadow: 0 0 20px var(--main-cyan); }
        .badge { position: absolute; top: -15px; right: 20px; background: var(--main-purple); padding: 8px 20px; border-radius: 50px; font-size: 14px; font-weight: bold; border: 2px solid #000; }
        
        /* Admin Access Button */
        #admin-portal-btn { display: none; margin-top: 15px; background: #fff; color: #000; }
        
        /* Admin Panel Overlay */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .req-item { background: #111; border: 1px solid #333; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .proof-img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; margin: 10px 0; cursor: pointer; }
    </style>
</head>
<body>

    <!-- الشاشة الرئيسية -->
    <div id="auth-screen" class="glass-card">
        <h1>M.NAJM System</h1>
        <div class="input-group"><input type="email" id="email" placeholder="البريد الإلكتروني"></div>
        <div class="input-group"><input type="password" id="pass" placeholder="كلمة المرور"></div>
        <button class="btn-neon btn-cyan" onclick="authAction('login')">دخول المنصة</button>
        <button class="btn-neon" style="color: #666;" onclick="authAction('reg')">إنشاء حساب جديد</button>
    </div>

    <div id="main-app" class="glass-card" style="display: none;">
        <div class="badge">الرصيد: <span id="balance">0</span> عملة</div>
        <h2>Simulation Engine</h2>
        
        <div id="display-box">1.00x</div>
        
        <button class="btn-neon btn-cyan" id="start-btn" onclick="runEngine()">تشغيل المحاكاة (-10 عملات)</button>
        
        <div style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;">
            <p style="font-size: 12px; color: #888;">Orange Cash: 01211056530</p>
            <input type="file" id="proof-img" style="font-size: 12px; margin-bottom: 10px;">
            <button class="btn-neon btn-purple" onclick="sendPayment()">شحن الرصيد</button>
        </div>

        <button id="admin-portal-btn" class="btn-neon" onclick="openAdmin()">لوحة الإدارة 👑</button>
        <button onclick="firebase.auth().signOut()" style="background:none; border:none; color:#555; width:100%; margin-top:20px; cursor:pointer;">خروج</button>
    </div>

    <!-- لوحة الأدمن المخفية -->
    <div id="admin-panel">
        <button onclick="closeAdmin()" style="color:red; background:none; border:1px solid red; padding:10px; border-radius:10px; cursor:pointer;">إغلاق اللوحة</button>
        <h1 style="color: var(--main-purple);">M.NAJM Control Center</h1>
        <div id="requests-list"></div>
    </div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyB1N7DfU_VUbNeDzCz2Ke2vc7rPWuPGY_0",
        authDomain: "mahmodya-73e03.firebaseapp.com",
        databaseURL: "https://mahmodya-73e03-default-rtdb.firebaseio.com",
        projectId: "mahmodya-73e03",
        storageBucket: "mahmodya-73e03.firebasestorage.app",
        appId: "1:659673740771:web:0a99b82c985072a754dcd6"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const storage = firebase.storage();

    let userBalance = 0;
    const ADMIN_EMAIL = "talah2026.2@gmail.com"; // حسابك كأدمن

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            if(user.email === ADMIN_EMAIL) document.getElementById('admin-portal-btn').style.display = 'block';
            
            db.ref('users/' + user.uid).on('value', s => {
                userBalance = s.val()?.balance || 0;
                document.getElementById('balance').innerText = userBalance;
            });
        } else {
            document.getElementById('auth-screen').style.display = 'block';
            document.getElementById('main-app').style.display = 'none';
        }
    });

    function authAction(t) {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        if(t === 'reg') {
            auth.createUserWithEmailAndPassword(e,p).then(r => db.ref('users/'+r.user.uid).set({email:e, balance:10}));
        } else {
            auth.signInWithEmailAndPassword(e,p).catch(err => alert(err.message));
        }
    }

    // Engine
    function runEngine() {
        if(userBalance < 10) return alert("رصيدك خلص!");
        const btn = document.getElementById('start-btn');
        btn.disabled = true;
        db.ref('users/' + auth.currentUser.uid).update({ balance: userBalance - 10 });

        let mult = 1.00;
        const crash = (Math.random() * 4 + 1.1).toFixed(2);
        const display = document.getElementById('display-box');
        display.style.color = "var(--main-cyan)";

        const interval = setInterval(() => {
            mult += 0.04;
            display.innerText = mult.toFixed(2) + "x";
            if(mult >= crash) {
                clearInterval(interval);
                display.innerText = "BOOM! " + mult.toFixed(2);
                display.style.color = "#ff4d4d";
                setTimeout(() => { btn.disabled = false; display.innerText = "1.00x"; }, 2000);
            }
        }, 80);
    }

    // Payment
    function sendPayment() {
        const file = document.getElementById('proof-img').files[0];
        if(!file) return alert("فين صورة التحويل؟");
        const path = `proofs/${auth.currentUser.uid}_${Date.now()}`;
        storage.ref(path).put(file).then(s => s.ref.getDownloadURL()).then(url => {
            db.ref('paymentRequests').push({
                uid: auth.currentUser.uid,
                email: auth.currentUser.email,
                img: url,
                status: 'pending'
            });
            alert("طلبك وصل يا نجم، الأدمن هيراجعه ويشحنلك.");
        });
    }

    // Admin Logic
    function openAdmin() { document.getElementById('admin-panel').style.display = 'block'; loadRequests(); }
    function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }

    function loadRequests() {
        db.ref('paymentRequests').on('value', snap => {
            const list = document.getElementById('requests-list');
            list.innerHTML = '';
            snap.forEach(child => {
                const r = child.val();
                if(r.status === 'pending') {
                    list.innerHTML += `
                        <div class="req-item">
                            <p>${r.email}</p>
                            <img src="${r.img}" class="proof-img" onclick="window.open('${r.img}')">
                            <input type="number" id="amt-${child.key}" placeholder="كمية العملات">
                            <button onclick="approve('${child.key}','${r.uid}')" style="background:green; color:#fff; border:none; padding:10px; width:100%; border-radius:8px;">شحن وموافقة</button>
                        </div>
                    `;
                }
            });
        });
    }

    function approve(reqId, uid) {
        const amt = document.getElementById('amt-'+reqId).value;
        if(!amt) return alert("اكتب هتشحن كام!");
        db.ref('users/'+uid+'/balance').transaction(c => (c||0) + parseInt(amt));
        db.ref('paymentRequests/'+reqId).update({status: 'approved'});
        alert("تم الشحن!");
    }
</script>
</body>
</html>
