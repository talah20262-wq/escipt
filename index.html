<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.NAJM | Radar System</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <style>
        :root {
            --neon-green: #39ff14; --cyber-red: #ff003c; --bg: #050505;
            --fuel-gold: #ffcc00; --glass: rgba(255, 255, 255, 0.03);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: #fff; margin: 0; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }

        /* 🌌 خلفية الرادار المدمجة (SVG Base64) */
        body::after {
            content:""; position:fixed; inset:0; z-index: -1;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0V0zm20 20L0 0m40 40L20 20' stroke='%2339ff14' stroke-width='0.5' fill='none' fill-rule='evenodd' opacity='0.1'/%3E%3C/svg%3E");
        }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(57, 255, 20, 0.2);
            border-radius: 25px; padding: 30px; width: 95%; max-width: 480px; text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(57, 255, 20, 0.1);
        }

        /* 🚀 الطيارة (Embedded SVG) */
        .plane-svg { width: 60px; height: 60px; filter: drop-shadow(0 0 10px var(--neon-green)); }

        #radar-screen {
            height: 280px; background: radial-gradient(circle, #001a00 0%, #000 70%);
            border: 2px solid var(--neon-green); border-radius: 50%; position: relative; 
            overflow: hidden; margin: 20px auto; display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 50px #003300;
        }

        /* Scan Line Effect */
        #radar-screen::before {
            content: ""; position: absolute; top: 50%; left: 50%; width: 50%; height: 2px;
            background: var(--neon-green); transform-origin: left;
            animation: scan 4s linear infinite; box-shadow: 0 0 15px var(--neon-green);
        }
        @keyframes scan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #multiplier { font-size: 4rem; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 25px var(--neon-green); z-index: 10; }
        
        .btn-main {
            background: none; border: 2px solid var(--neon-green); color: var(--neon-green);
            padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer;
            transition: 0.3s; text-transform: uppercase; margin-top: 10px;
        }
        .btn-main:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }
        .btn-google { background: #fff; color: #000; border: none; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* Admin & Status */
        .fuel-badge { background: #000; border: 1px solid var(--fuel-gold); color: var(--fuel-gold); padding: 5px 15px; border-radius: 20px; font-size: 14px; }
        #admin-panel { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 20px; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- 1. AUTH VIEW -->
    <div id="view-auth" class="glass-card">
        <h1 style="color: var(--neon-green); letter-spacing: 5px;">M.NAJM</h1>
        <p style="font-size: 10px; color: #888;">RADAR SYSTEM ARMED</p>
        
        <button class="btn-main btn-google" onclick="app.googleLogin()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z" fill="#4285F4"/><path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.33-1.57-5.04-3.67H.95v2.33A9 9 0 0 0 9 18z" fill="#34A853"/><path d="M3.96 10.75A5.41 5.41 0 0 1 3.65 9c0-.6.1-1.19.31-1.75V4.92H.95A9 9 0 0 0 .95 13.08l3.01-2.33z" fill="#FBBC05"/><path d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.47A8.87 8.87 0 0 0 9 0C5.48 0 2.44 2.02.95 4.92l3.01 2.33C4.67 5.15 6.66 3.58 9 3.58z" fill="#EA4335"/></svg>
            Sign in with Google
        </button>

        <input type="email" id="auth-email" placeholder="Email Address">
        <input type="password" id="auth-pass" placeholder="Password">
        <button class="btn-main" onclick="app.emailAuth()">Access System</button>
    </div>

    <!-- 2. MAIN VIEW -->
    <div id="view-dash" class="glass-card" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span class="fuel-badge">FUEL: <span id="val-fuel">0</span> L</span>
            <button onclick="firebase.auth().signOut()" style="background:none; border:none; color:red; cursor:pointer;">Exit</button>
        </div>
        
        <div id="radar-screen">
            <div id="multiplier">1.00x</div>
            <!-- Embedded Airplane SVG -->
            <div id="plane" style="position:absolute; bottom:20px; right:20px;">
                <svg class="plane-svg" viewBox="0 0 24 24" fill="var(--neon-green)"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
            </div>
        </div>

        <button id="btn-run" class="btn-main" onclick="app.launch()">ابدأ الجولة الآن ⚡</button>
        <p id="status-text" style="font-size:11px; color:var(--neon-green); margin-top:10px;">System Ready.</p>

        <div style="margin-top:20px; border-top:1px solid rgba(57,255,20,0.2); padding-top:10px;">
            <p style="font-size:12px; color:var(--fuel-gold);">Orange Cash: 01206561893</p>
            <input type="file" id="pay-file" style="font-size:10px;">
            <button class="btn-main" style="padding:5px; border-color:var(--fuel-gold); color:var(--fuel-gold);" onclick="app.upload()">إرسال الإثبات</button>
        </div>
        <button id="admin-portal" class="btn-main" style="display:none; border-color:#fff; color:#fff;" onclick="app.toggleAdmin(true)">ADMIN PANEL 👑</button>
    </div>

    <!-- 3. ADMIN PANEL -->
    <div id="admin-panel">
        <h1 style="color:var(--cyber-red)">Command Center</h1>
        <button onclick="app.toggleAdmin(false)" style="color:#fff; background:none; border:1px solid #fff; padding:10px; border-radius:5px;">Close</button>
        <div id="admin-req-list" style="margin-top:20px;"></div>
    </div>

<script>
const app = {
    config: {
        apiKey: "AIzaSyB1N7DfU_VUbNeDzCz2Ke2vc7rPWuPGY_0",
        authDomain: "mahmodya-73e03.firebaseapp.com",
        databaseURL: "https://mahmodya-73e03-default-rtdb.firebaseio.com",
        projectId: "mahmodya-73e03",
        storageBucket: "mahmodya-73e03.firebasestorage.app",
        appId: "1:659673740771:web:0a99b82c985072a754dcd6"
    },
    owner: "talah2026.2@gmail.com",
    fuel: 0,

    init() {
        firebase.initializeApp(this.config);
        firebase.auth().onAuthStateChanged(user => {
            if(user) {
                this.show('view-dash');
                if(user.email === this.owner) document.getElementById('admin-portal').style.display='block';
                firebase.database().ref('users/'+user.uid).on('value', s => {
                    this.fuel = s.val()?.balance || 0;
                    document.getElementById('val-fuel').innerText = this.fuel;
                });
            } else { this.show('view-auth'); }
        });
    },

    googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider);
    },

    emailAuth() {
        const e = document.getElementById('auth-email').value;
        const p = document.getElementById('auth-pass').value;
        firebase.auth().signInWithEmailAndPassword(e,p).catch(() => {
            firebase.auth().createUserWithEmailAndPassword(e,p).then(r => {
                firebase.database().ref('users/'+r.user.uid).set({email:e, balance:50});
            });
        });
    },

    launch() {
        if(this.fuel < 10) return alert("انتهى الوقود ⛽");
        const btn = document.getElementById('btn-run');
        const plane = document.getElementById('plane');
        const disp = document.getElementById('multiplier');
        btn.disabled = true;
        firebase.database().ref('users/'+firebase.auth().currentUser.uid).update({balance: this.fuel-10});

        let m = 1.00;
        let crash = (1.1 + Math.random()*3.5).toFixed(2);
        const timer = setInterval(() => {
            m += 0.04;
            disp.innerText = m.toFixed(2) + "x";
            plane.style.transform = `translate(-${m*40}px, -${m*30}px) scale(${1+m/10})`;
            if(m >= crash) {
                clearInterval(timer);
                disp.style.color = 'var(--cyber-red)';
                setTimeout(() => { btn.disabled=false; disp.style.color='var(--neon-green)'; }, 2000);
            }
        }, 100);
    },

    upload() {
        const f = document.getElementById('pay-file').files[0];
        if(!f) return alert("Select File");
        const ref = firebase.storage().ref(`proofs/${Date.now()}`);
        ref.put(f).then(s => s.ref.getDownloadURL()).then(url => {
            firebase.database().ref('requests').push({uid: firebase.auth().currentUser.uid, email: firebase.auth().currentUser.email, img: url, status: 'p'});
            alert("Sent!");
        });
    },

    toggleAdmin(v) {
        document.getElementById('admin-panel').style.display = v?'block':'none';
        if(v) {
            firebase.database().ref('requests').on('value', snap => {
                const list = document.getElementById('admin-req-list');
                list.innerHTML = '';
                snap.forEach(c => {
                    const r = c.val();
                    if(r.status === 'p') {
                        list.innerHTML += `<div style="background:#111; padding:10px; border:1px solid var(--neon-green); margin-bottom:10px;">
                            <p>${r.email}</p>
                            <img src="${r.img}" style="width:100px; cursor:pointer;" onclick="window.open('${r.img}')">
                            <input type="number" id="amt-${c.key}" placeholder="Fuel">
                            <button onclick="app.approve('${c.key}','${r.uid}')">Charge</button>
                        </div>`;
                    }
                });
            });
        }
    },

    approve(k, u) {
        const a = document.getElementById('amt-'+k).value;
        firebase.database().ref('users/'+u+'/balance').transaction(c => (c||0)+parseInt(a));
        firebase.database().ref('requests/'+k).update({status: 'a'});
    },

    show(id) {
        document.getElementById('view-auth').style.display='none';
        document.getElementById('view-dash').style.display='none';
        document.getElementById(id).style.display='block';
    }
};
app.init();
</script>
</body>
</html>
