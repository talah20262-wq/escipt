<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.NAJM | Premium Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon: #39ff14; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-text { color: var(--neon); text-shadow: 0 0 15px rgba(57, 255, 20, 0.5); }
        .neon-btn { background: var(--neon); color: #000; font-weight: 900; transition: 0.3s; }
        .neon-btn:hover:not(:disabled) { box-shadow: 0 0 25px var(--neon); transform: scale(1.02); }
    </style>
</head>
<body class="p-4">

    <!-- Auth Section -->
    <div id="auth-section" class="max-w-md mx-auto mt-20 text-center">
        <h1 class="text-5xl font-black neon-text mb-10 italic">M.NAJM</h1>
        <div class="glass p-8 rounded-[2.5rem]">
            <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full bg-white/5 p-4 rounded-xl mb-4 border border-white/10 outline-none">
            <input id="pass" type="password" placeholder="كلمة السر" class="w-full bg-white/5 p-4 rounded-xl mb-6 border border-white/10 outline-none">
            <button onclick="handleAuth('login')" class="neon-btn w-full py-4 rounded-xl mb-3">دخول</button>
            <button onclick="handleAuth('register')" class="text-xs text-gray-500">إنشاء حساب جديد</button>
        </div>
    </div>

    <!-- Main App Section -->
    <div id="app-section" class="hidden max-w-lg mx-auto">
        <header class="flex justify-between items-center glass p-6 rounded-3xl mb-8">
            <span id="user-display" class="text-xs font-bold opacity-50">--</span>
            <div class="text-right">
                <span class="neon-text font-black text-xl"><i class="fas fa-coins"></i> <span id="coin-count">0</span></span>
            </div>
        </header>

        <main class="glass p-12 rounded-[3.5rem] text-center mb-8">
            <div id="loader" class="hidden py-10 animate-pulse text-neon">ANALYSING...</div>
            <div id="display">
                <div id="crash-val" class="text-7xl font-black mb-10">x0.00</div>
                <button id="start-btn" onclick="runSim()" class="neon-btn w-full py-5 rounded-2xl uppercase">إطلاق المحاكي (10 عملات)</button>
            </div>
        </main>

        <div class="glass p-6 rounded-3xl border-r-4 border-orange-500 flex justify-between items-center">
            <div>
                <h4 class="font-bold text-sm">شحن 1000 عملة</h4>
                <p class="text-[10px] text-gray-500">أورنج كاش: 01206561893</p>
            </div>
            <button onclick="recharge()" class="bg-orange-600 px-6 py-2 rounded-xl font-bold text-xs">شحن 400ج</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://mahmodya-73e03-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        async function handleAuth(t) {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try {
                if(t === 'register') {
                    const r = await auth.createUserWithEmailAndPassword(e, p);
                    await db.ref('users/' + r.user.uid).set({ email: e, coins: 0, role: 'user' });
                } else { await auth.signInWithEmailAndPassword(e, p); }
            } catch (err) { Swal.fire('خطأ', err.message, 'error'); }
        }

        auth.onAuthStateChanged(u => {
            if(u) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-display').innerText = u.email;
                db.ref('users/' + u.uid).on('value', s => {
                    document.getElementById('coin-count').innerText = s.val().coins;
                });
            }
        });

        async function runSim() {
            const uRef = db.ref('users/' + auth.currentUser.uid);
            const s = await uRef.get();
            if(s.val().coins < 10) return Swal.fire('رصيد غير كافٍ');

            await uRef.update({ coins: s.val().coins - 10 });
            document.getElementById('display').classList.add('opacity-10');
            document.getElementById('loader').classList.remove('hidden');

            await new Promise(r => setTimeout(r, 3000));
            const res = (1.1 + Math.random() * 3.4).toFixed(2);

            document.getElementById('loader').classList.add('hidden');
            document.getElementById('display').classList.remove('opacity-10');
            document.getElementById('crash-val').innerText = `x${res}`;
        }

        async function recharge() {
            const { value: file } = await Swal.fire({
                title: 'شحن العملات',
                html: 'حول 400ج لـ <b>01206561893</b> وارفع الإيصال:',
                input: 'file', inputAttributes: { 'accept': 'image/*' }
            });
            if(file) {
                const r = new FileReader();
                r.onload = async (e) => {
                    await db.ref('payments/' + Date.now()).set({
                        userId: auth.currentUser.uid,
                        email: auth.currentUser.email,
                        image: e.target.result,
                        status: 'pending'
                    });
                    Swal.fire('تم الإرسال');
                };
                r.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
