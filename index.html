<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.NAJM | Login</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --neon: #00f3ff; --premium: #7000ff; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI'; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #111; padding: 30px; border-radius: 15px; border: 1px solid var(--premium); box-shadow: 0 0 15px var(--premium); width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; border-radius: 5px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-main { background: var(--premium); color: white; }
        .btn-google { background: #db4437; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: var(--neon);">M.NAJM</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="pass" placeholder="كلمة السر">
        <button class="btn-main" onclick="authAction('login')">تسجيل دخول</button>
        <button class="btn-main" style="background:transparent; border:1px solid var(--premium)" onclick="authAction('register')">إنشاء حساب</button>
        <div style="margin:10px">أو</div>
        <button class="btn-google" onclick="googleLogin()">الدخول بـ Google</button>
    </div>

    <script>
        // ضع بيانات مشروعك هنا (mahmodya-73e03)
        const config = {
            apiKey: "AIzaSy...", 
            authDomain: "mahmodya-73e03.firebaseapp.com",
            databaseURL: "https://mahmodya-73e03-default-rtdb.firebaseio.com",
            projectId: "mahmodya-73e03"
        };
        firebase.initializeApp(config);
        const auth = firebase.auth();
        const db = firebase.database();

        async function authAction(type) {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                if(type === 'register') {
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.ref('users/' + res.user.uid).set({ email, coins: 0, role: 'user' });
                    Swal.fire('نجاح', 'تم إنشاء الحساب', 'success');
                } else {
                    await auth.signInWithEmailAndPassword(email, pass);
                }
                window.location.href = 'dashboard.html';
            } catch(e) { Swal.fire('خطأ', e.message, 'error'); }
        }

        async function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await auth.signInWithPopup(provider);
                const snap = await db.ref('users/' + res.user.uid).once('value');
                if(!snap.exists()) {
                    await db.ref('users/' + res.user.uid).set({ email: res.user.email, coins: 0, role: 'user' });
                }
                window.location.href = 'dashboard.html';
            } catch(e) { Swal.fire('خطأ', e.message, 'error'); }
        }
    </script>
</body>
</html>
